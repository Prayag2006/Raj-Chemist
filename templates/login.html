<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Access Control</title>
  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.png') }}" type="image/x-icon">
  
  <!-- Bootstrap & Fonts -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    :root {
      --color-primary: #f59e0b; /* Yellow primary */
      --color-primary-hover: #d97706;
      --color-bg-dark: #111827;
      --color-text-dark: #1f2937;
      --color-text-muted: #6b7280;
      --font-family-serif: 'Instrument Serif', Georgia, serif;
      --font-family-sans: 'Inter', system-ui, sans-serif;
    }

    body {
      background-color: #0f172a;
      font-family: var(--font-family-sans);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      position: relative;
      overflow: hidden;
    }

    /* Top Ribbon Accent */
    .top-ribbon {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--color-primary), #fbbf24);
      z-index: 10;
    }

    /* Premium Ambient Light Effect */
    .ambient-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(245, 158, 11, 0.08) 0%, rgba(245, 158, 11, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 0;
      pointer-events: none;
    }

    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 40px 30px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .login-card:hover {
      box-shadow: 0 25px 30px -5px rgba(0, 0, 0, 0.6), 0 15px 15px -5px rgba(245, 158, 11, 0.05);
    }

    .brand-title {
      font-family: var(--font-family-serif);
      font-size: 36px;
      letter-spacing: 0.5px;
      font-weight: normal;
      color: #ffffff;
      margin-bottom: 5px;
      text-align: center;
    }

    .brand-accent {
      color: var(--color-primary);
      font-weight: 800;
    }

    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      text-align: center;
      margin-bottom: 35px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      font-weight: 500;
    }

    .form-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .input-group-custom {
      position: relative;
      display: flex;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .input-group-custom:focus-within {
      border-color: var(--color-primary);
      box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.15);
    }

    .input-icon {
      padding: 12px 15px;
      color: #64748b;
    }

    .form-control-custom {
      flex: 1;
      background: transparent;
      border: none;
      color: #ffffff;
      padding: 12px 10px;
      font-size: 14px;
      outline: none;
    }

    .form-control-custom::placeholder {
      color: #475569;
    }

    .btn-toggle-pass {
      background: transparent;
      border: none;
      color: #64748b;
      padding: 0 15px;
      cursor: pointer;
      transition: color 0.2s;
    }

    .btn-toggle-pass:hover {
      color: #f8fafc;
    }

    .btn-submit {
      background: linear-gradient(135deg, var(--color-primary) 0%, #d97706 100%);
      color: #0f172a;
      border: none;
      border-radius: 8px;
      padding: 12px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      cursor: pointer;
    }

    .btn-submit:hover {
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
      opacity: 0.95;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .alert-custom {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 15px;
      margin-bottom: 20px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .footer-links {
      text-align: center;
      margin-top: 30px;
      font-size: 12px;
    }

    .footer-links a {
      color: var(--color-primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .footer-links a:hover {
      color: var(--color-primary-hover);
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="top-ribbon"></div>
  <div class="ambient-glow"></div>

  <div class="login-container">
    <div class="login-card">
      <h3 class="brand-title">RAJ <span class="brand-accent">CHEMIST</span></h3>
      <div class="subtitle">System Administration</div>

      {% if error %}
      <div class="alert-custom">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST" class="d-grid gap-4">
        <div>
          <label class="form-label" for="password">Enter Administrator Password</label>
          <div class="input-group-custom">
            <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
            <input type="password" id="password" name="password" class="form-control-custom" placeholder="••••••••" required autofocus>
            <button type="button" class="btn-toggle-pass" id="togglePassBtn"><i class="fa-regular fa-eye"></i></button>
          </div>
        </div>

        <button type="submit" class="btn-submit"><i class="fa-solid fa-shield-halved me-2"></i>Authenticate</button>
      </form>

      <div class="footer-links">
        <a href="/mark_attendance"><i class="fa-solid fa-arrow-left-long me-2"></i>Go back to Attendance Scanner</a>
      </div>
    </div>
  </div>

  <script>
    const passwordInput = document.getElementById('password');
    const togglePassBtn = document.getElementById('togglePassBtn');
    
    togglePassBtn.addEventListener('click', () => {
      const isPass = passwordInput.type === 'password';
      passwordInput.type = isPass ? 'text' : 'password';
      togglePassBtn.innerHTML = isPass ? '<i class="fa-regular fa-eye-slash"></i>' : '<i class="fa-regular fa-eye"></i>';
    });
  </script>
</body>
</html>
